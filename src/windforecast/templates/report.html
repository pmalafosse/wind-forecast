<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wind Forecast</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:            #f0f4f9;
            --surface:       #ffffff;
            --surface-2:     #f7f9fc;
            --border:        #e3e8ef;
            --text:          #374151;
            --text-strong:   #111827;
            --text-muted:    #9ca3af;
            --accent:        #0ea5e9;
            --accent-dim:    rgba(14, 165, 233, 0.1);

            /* Too much wind — red: stop/danger */
            --tm-bg:     #fecaca;
            --tm-text:   #991b1b;
            --tm-bar:    #dc2626;

            /* Hardcore — orange: expert only */
            --hc-bg:     #fed7aa;
            --hc-text:   #9a3412;
            --hc-bar:    #ea580c;

            /* Kiteable (ok/good/great/insane) — green: go! */
            --good-bg:   #d1fae5;
            --good-text: #065f46;
            --good-bar:  #10b981;

            /* Good — blue */
            --ok-bg:     #dbeafe;
            --ok-text:   #1d4ed8;
            --ok-bar:    #3b82f6;

            /* Light wind — gray: not enough */
            --light-bg:  #f1f5f9;
            --light-text:#475569;
            --light-bar: #94a3b8;

            --radius: 10px;
            --ctrl-h: 52px; /* sticky bar height, used for scroll-margin */
        }

        *, *::before, *::after { box-sizing: border-box; }

        html {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            line-height: 1.5;
            margin: 0;
            padding: 16px;
            background-color: var(--bg);
            min-height: 100vh;
            color: var(--text);
        }

        /* ── CONTROLS ────────────────────────────────── */
        .controls {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(240, 244, 249, 0.94);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 10px 0;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .controls button {
            padding: 6px 14px;
            border-radius: 20px;
            border: 1.5px solid var(--border);
            background: var(--surface);
            cursor: pointer;
            font-size: 12px;
            font-family: 'IBM Plex Sans', sans-serif;
            font-weight: 500;
            color: var(--text);
            transition: border-color 0.15s, color 0.15s, background 0.15s, box-shadow 0.15s;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .controls button:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-dim);
        }

        .controls button.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 2px 8px rgba(14, 165, 233, 0.3);
        }

        /* ── LEGEND ──────────────────────────────────── */
        .legend {
            display: flex;
            gap: 10px;
            align-items: center;
            flex: 1;
            flex-wrap: wrap;
            margin-left: 4px;
        }

        .l-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .l-dot {
            width: 8px;
            height: 8px;
            border-radius: 2px;
            flex-shrink: 0;
        }

        /* ── SEARCH + INFO ───────────────────────────── */
        .controls-right {
            display: flex;
            gap: 6px;
            align-items: center;
            margin-left: auto;
            flex-shrink: 0;
        }

        .search-box input {
            padding: 6px 12px;
            border: 1.5px solid var(--border);
            border-radius: 20px;
            font-size: 12px;
            font-family: 'IBM Plex Sans', sans-serif;
            background: var(--surface);
            color: var(--text);
            width: 180px;
            transition: border-color 0.15s, box-shadow 0.15s, width 0.2s;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-dim);
            width: 220px;
        }

        .search-box input::placeholder { color: var(--text-muted); }

        .info-wrap { position: relative; }

        .info-btn {
            width: 30px;
            height: 30px;
            padding: 0;
            border-radius: 50% !important;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: var(--text-muted) !important;
            border-color: var(--border) !important;
            background: var(--surface) !important;
            box-shadow: none !important;
        }

        .info-btn:hover {
            color: var(--accent) !important;
            border-color: var(--accent) !important;
            background: var(--accent-dim) !important;
        }

        .info-popup {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 11px;
            color: var(--text-muted);
            min-width: 240px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
            z-index: 200;
        }

        .info-popup.open { display: block; }

        .info-timestamp {
            padding-bottom: 8px;
            margin-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .info-model-row {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            padding: 4px 0;
            border-bottom: 1px solid var(--border);
        }

        .info-model-row:last-child { border-bottom: none; }

        .info-model-name { font-weight: 500; color: var(--text); }
        .info-model-run  { font-family: 'IBM Plex Mono', monospace; font-size: 10px; }

        /* ── DAY SECTIONS ────────────────────────────── */
        .day-section {
            margin-bottom: 14px;
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 14px 16px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
            position: relative;
            overflow: hidden; /* clips scroll-hint ::after and rounds table edges */
            scroll-margin-top: calc(var(--ctrl-h) + 8px);
        }

        /* Today highlight */
        .day-section[data-today] {
            border-color: var(--accent);
            box-shadow: 0 1px 4px rgba(14, 165, 233, 0.15);
        }

        .day-section[data-today] h2 {
            color: var(--accent);
        }

        /* Scroll hint: right-edge fade when table overflows */
        .day-section[data-scroll-hint]::after {
            content: '';
            position: absolute;
            top: 0; right: 0; bottom: 0;
            width: 48px;
            background: linear-gradient(to left, var(--surface), transparent);
            pointer-events: none;
            z-index: 6;
        }

        .day-section h2 {
            margin: 0 0 10px 0;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        /* ── TABLE ───────────────────────────────────── */
        .table-container {
            overflow-x: auto;
            margin: 0 -16px;
            padding: 0 16px;
            -webkit-overflow-scrolling: touch;
        }

        table.forecast-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            margin: 0;
        }

        th, td {
            padding: 7px 5px;
            text-align: center;
            min-width: 78px;
            border-right: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            font-size: 11px;
        }

        th:first-child, td:first-child {
            max-width: 80px;
            min-width: 60px !important;
            border-left: 1px solid var(--border);
        }

        th {
            background-color: var(--surface-2);
            color: var(--text-muted);
            position: sticky;
            top: 0;
            z-index: 10;
            white-space: nowrap;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            border-top: 1px solid var(--border);
        }

        td { vertical-align: top; }

        .spotcol {
            position: sticky;
            left: 0;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 5;
            text-align: left;
            font-size: 11px;
            font-weight: 600;
            max-width: 80px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 8px;
            color: var(--text-strong);
        }

        .min15-dot {
            display: inline-block;
            width: 5px;
            height: 5px;
            background-color: var(--accent);
            border-radius: 50%;
            vertical-align: middle;
            margin-left: 3px;
        }

        /* ── CELL DATA ───────────────────────────────── */
        .cell-data { background-color: transparent; color: var(--text-muted); }
        .cell-data.kiteable { color: var(--text); }

        .cell-data.not-kiteable { opacity: 0.4; }
        body[data-show-all="true"] .cell-data.not-kiteable { opacity: 1; }

        .wind {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            font-weight: 600;
        }

        .dir {
            font-size: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            color: var(--text-muted);
            margin-top: 1px;
        }

        .cell-data.kiteable .dir { color: inherit; }

        .dir-arrow {
            display: inline-block;
            font-family: sans-serif;
            transform-origin: center;
            font-size: 1.15em;
        }

        .wave, .rain { font-size: 9px; margin-top: 1px; color: var(--text-muted); }
        .stars { color: #d97706; margin-top: 1px; font-size: 9px; letter-spacing: 0.5px; }

        .day-start     { border-left: 2px solid #cbd5e1 !important; }
        th.day-start   { border-top: 2px solid #cbd5e1 !important; }

        /* ── WIND BANDS ──────────────────────────────── */
        .too-much  { background-color: var(--tm-bg)   !important; border-left: 3px solid var(--tm-bar)   !important; }
        .hardcore  { background-color: var(--hc-bg)   !important; border-left: 3px solid var(--hc-bar)   !important; }
        .good      { background-color: var(--good-bg) !important; border-left: 3px solid var(--good-bar) !important; }
        .light     { background-color: var(--light-bg)!important; border-left: 3px solid var(--light-bar)!important; }
        .ok        { background-color: var(--ok-bg)   !important; border-left: 3px solid var(--ok-bar)   !important; }
        .insane, .great, .very-good { background-color: var(--good-bg) !important; border-left: 3px solid var(--good-bar) !important; }
        .below     { background-color: transparent !important; }

        .too-much  .wind { color: var(--tm-text);    }
        .hardcore  .wind { color: var(--hc-text);    }
        .good      .wind { color: var(--good-text);  }
        .light     .wind { color: var(--light-text); }
        .ok        .wind { color: var(--ok-text);    }
        .insane .wind, .great .wind, .very-good .wind { color: var(--good-text); }

        /* ── SPOT LINK ───────────────────────────────── */
        .spot-link { color: inherit; text-decoration: none; }
        .spot-link:hover { color: var(--accent); }

        /* ── DAILY SUMMARY ───────────────────────────── */
        .daily-summary {
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            margin: 0 0 14px 0;
            padding: 14px 16px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
            display: none !important;
        }

        body[data-show-summary="true"] .daily-summary { display: block !important; }

        .daily-summary h2 {
            font-size: 12px; font-weight: 600;
            letter-spacing: 0.12em; text-transform: uppercase;
            color: var(--text-muted); margin: 0 0 12px 0;
        }

        .daily-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 14px;
        }

        .day-summary { padding: 0; }

        .daily-summary h3 {
            font-size: 11px; font-weight: 600;
            letter-spacing: 0.1em; text-transform: uppercase;
            color: var(--text-muted); margin: 0 0 8px 0;
            padding-bottom: 6px; border-bottom: 1px solid var(--border);
        }

        .daily-summary ul { list-style: none; padding: 0; margin: 0; }

        .daily-summary li {
            margin: 5px 0; padding: 8px 10px;
            background: var(--surface-2);
            border-radius: 6px; border: 1px solid var(--border);
            font-size: 12px;
        }

        .daily-summary .stats { color: var(--text-muted); font-size: 11px; margin-top: 3px; }
        .daily-summary .stars { display: inline; }

        .model-name { font-weight: 500; color: var(--text); }
        .model-run { color: var(--text-muted); font-family: 'IBM Plex Mono', monospace; font-size: 11px; }

        /* ── VIEW SWITCHING ──────────────────────────── */
        #kiteable-view          { display: block; }
        #all-conditions-view    { display: none;  }
        body[data-show-all="true"] #kiteable-view       { display: none;  }
        body[data-show-all="true"] #all-conditions-view { display: block; }

        /* ── HIDDEN ROWS ─────────────────────────────── */
        tr[data-hidden="true"]   { display: none; }
        tr[data-filtered="true"] { display: none !important; }

        /* ── MODAL ───────────────────────────────────── */
        #plot-modal {
            display: none; position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.5); z-index: 1000;
            align-items: center; justify-content: center;
            backdrop-filter: blur(6px); padding: 16px;
        }
        #plot-modal.open { display: flex; }

        #plot-modal-inner {
            background: var(--surface); border-radius: var(--radius);
            border: 1px solid var(--border); padding: 16px;
            max-width: 90vw; max-height: 90vh; width: 100%;
            overflow: auto; position: relative;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.2);
        }

        #plot-modal-inner img { display: block; max-width: 100%; }

        #plot-modal-close {
            position: absolute; top: 10px; right: 10px;
            background: var(--surface-2); border: 1px solid var(--border);
            border-radius: 50%; width: 28px; height: 28px;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; cursor: pointer; color: var(--text-muted);
            transition: color 0.1s, background 0.1s;
        }

        #plot-modal-close:hover { background: var(--border); color: var(--text); }
        #plot-modal-error { color: var(--text-muted); padding: 20px; font-size: 12px; }

        /* ── MOBILE ──────────────────────────────────── */
        @media (max-width: 600px) {
            body { padding: 10px; }

            .controls { gap: 6px; }
            .controls button { padding: 6px 11px; font-size: 11px; }

            .legend {
                order: 3;
                flex: none;
                width: 100%;
                margin-left: 0;
                padding-top: 8px;
                border-top: 1px solid var(--border);
            }

            .controls-right { margin-left: auto; }

            .search-box input {
                width: 130px;
                font-size: 14px; /* prevent iOS zoom */
            }
            .search-box input:focus { width: 150px; }

            .day-section { padding: 10px; }
            .table-container { margin: 0 -10px; padding: 0 10px; }

            th, td { padding: 5px 3px; min-width: 68px; font-size: 10px; }
            .wind  { font-size: 10px; }
            .dir   { font-size: 8px; }
            .wave, .rain, .stars { font-size: 8px; }
        }

        /* ── PRINT ───────────────────────────────────── */
        @media print {
            body { margin: 0; padding: 0; background: white !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            .day-section { page-break-before: always; margin-bottom: 30px; background: white; padding: 20px; border: none; box-shadow: none; overflow: visible; }
            .day-section:first-child { page-break-before: avoid; }
            .table-container { overflow: visible !important; width: auto !important; min-width: max-content !important; }
            .forecast-table { width: 100% !important; }
            td, th { min-width: 84px !important; }
            td:first-child, th:first-child { max-width: 80px !important; min-width: 60px !important; }
        }
    </style>
</head>
<body data-show-summary="false">
    <div class="controls">
        <div class="info-wrap">
            <button class="controls button info-btn" id="infoBtn" onclick="toggleInfo()">ⓘ</button>
            <div class="info-popup" id="info-popup">
                <div class="info-timestamp">Updated <!-- GENERATED_AT --></div>
                <!-- MODEL_UPDATES -->
            </div>
        </div>
        <button id="toggleView" onclick="toggleViewMode()">All Conditions</button>
        <button id="toggleSummary" onclick="toggleDailySummary()">Daily Summary</button>
        <div class="legend">
            <span class="l-item"><span class="l-dot" style="background:var(--light-bar)"></span>Light</span>
            <span class="l-item"><span class="l-dot" style="background:var(--ok-bar)"></span>Good</span>
            <span class="l-item"><span class="l-dot" style="background:var(--good-bar)"></span>Great</span>
            <span class="l-item"><span class="l-dot" style="background:var(--hc-bar)"></span>Hardcore</span>
            <span class="l-item"><span class="l-dot" style="background:var(--tm-bar)"></span>Too much</span>
        </div>
        <div class="controls-right">
            <div class="search-box">
                <input type="text" id="spotSearch" placeholder="Search spots…" oninput="filterSpots()">
            </div>
        </div>
    </div>
    <script>
        let showAllConditions = false;
        let showDailySummary = false;

        function toggleDailySummary() {
            showDailySummary = !showDailySummary;
            document.getElementById('toggleSummary').classList.toggle('active');
            document.body.setAttribute('data-show-summary', showDailySummary ? 'true' : 'false');
        }

        function toggleViewMode() {
            showAllConditions = !showAllConditions;
            document.getElementById('toggleView').classList.toggle('active');
            document.body.setAttribute('data-show-all', showAllConditions);
        }

        function filterSpots() {
            const searchTerm = document.getElementById('spotSearch').value.toLowerCase();
            const currentView = showAllConditions ? 'all-conditions-view' : 'kiteable-view';
            document.querySelectorAll(`#${currentView} tr.spot-row`).forEach(row => {
                const spotCell = row.querySelector('td.spotcol');
                if (!spotCell) return;
                const matches = spotCell.textContent.toLowerCase().includes(searchTerm);
                if (matches) row.removeAttribute('data-filtered');
                else row.setAttribute('data-filtered', 'true');
            });
        }

        function toggleInfo() {
            document.getElementById('info-popup').classList.toggle('open');
        }

        // Close info popup on outside click
        document.addEventListener('click', e => {
            if (!e.target.closest('.info-wrap')) {
                document.getElementById('info-popup').classList.remove('open');
            }
        });

        // Scroll hint: show right-edge fade when table has more content to the right
        function updateScrollHints() {
            document.querySelectorAll('.table-container').forEach(container => {
                const section = container.closest('.day-section');
                if (!section) return;
                const scrollable = container.scrollWidth > container.clientWidth + 2;
                const atEnd = container.scrollLeft >= container.scrollWidth - container.clientWidth - 2;
                if (scrollable && !atEnd) section.setAttribute('data-scroll-hint', '');
                else section.removeAttribute('data-scroll-hint');
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Initialize scroll hints
            document.querySelectorAll('.table-container').forEach(c => {
                c.addEventListener('scroll', updateScrollHints, { passive: true });
            });
            updateScrollHints();
            window.addEventListener('resize', updateScrollHints);

            // Scroll to today
            const today = document.querySelector('.day-section[data-today]');
            if (today) today.scrollIntoView({ block: 'start' });
        });
    </script>
    <!-- FORECAST_DATA -->

    <div id="plot-modal" onclick="if(event.target===this) closePlot()">
        <div id="plot-modal-inner">
            <button id="plot-modal-close" onclick="closePlot()" title="Close">&#x2715;</button>
            <div id="plot-modal-content"></div>
        </div>
    </div>

    <script>
        function showPlot(slug) {
            const src = `plots/${slug}_15min_today.png`;
            const content = document.getElementById('plot-modal-content');
            content.innerHTML = '';
            const img = document.createElement('img');
            img.src = src; img.alt = slug;
            img.onerror = () => {
                content.innerHTML = `<div id="plot-modal-error">No plot available for <strong>${slug}</strong>.<br>Plots are generated when running the full report update.</div>`;
            };
            content.appendChild(img);
            document.getElementById('plot-modal').classList.add('open');
        }

        function closePlot() {
            document.getElementById('plot-modal').classList.remove('open');
        }

        document.addEventListener('keydown', e => { if (e.key === 'Escape') closePlot(); });
    </script>
</body>
</html>
